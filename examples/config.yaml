# ACode 全局配置示例
# 复制到 ~/.acode/config.yaml 使用（Windows：C:\Users\<用户名>\.acode\config.yaml）

# 供应商协议：anthropic | openai
protocol: anthropic

# 模型名称
model: claude-sonnet-4-6

# API 请求地址
base_url: https://api.anthropic.com

# API 密钥（注意保密，不要提交到仓库）
api_key: sk-ant-你的密钥

# 上下文窗口上限（token），对话历史超过后自动丢弃最早消息
max_context_tokens: 200000

# Agent 循环最大轮数（默认 20），模型连续多轮工具调用触顶后停止执行
max_iterations: 20
