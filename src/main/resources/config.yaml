# ACode 内置默认配置（打包在 jar 中，作为三级加载链的最底层）
# 外部配置优先覆盖：~/.acode/config.yaml（全局）→ .acode/config.yaml（项目级，只写要覆盖的字段）
# 两级外部配置都不存在时使用本默认。api_key 为占位符（非空过校验），
# 未配置真实密钥时启动可进入，真正调用 API 才会报 AuthException。

# 供应商协议：anthropic | openai
protocol: openai

# 模型名称
model: deepseek-v4-flash

# API 请求地址
base_url: https://api.deepseek.com/v1

# API 密钥（占位符；请在外部配置 ~/.acode/config.yaml 或 .acode/config.yaml 覆盖真实密钥）
api_key: sk-请填入你的API密钥

# 上下文窗口上限（token）。接近上限时自动把较早的对话压缩成摘要，不丢弃消息
max_context_tokens: 200000

# Agent 循环最大轮数（默认 20），模型连续多轮工具调用触顶后停止执行
max_iterations: 20

# 自动记忆提取开关（默认 true）：开启时每轮 Agent 循环自然结束后，后台异步回顾本轮对话，
# 决定是否创建/更新/删除长期记忆（用户偏好、纠正反馈、项目知识、参考信息）。
# 关掉后不再有每轮后台模型调用；/memory run 手动入口仍然可用。
memory_auto: true

# 诊断 tee 开关：设为 true 时把原始 SSE / 收到的 delta / 写进终端的字节分别记录到
# acode-sse.log、acode-streamprinter.log、acode-terminal.log（相对启动目录）。
# 默认 false（不产生诊断日志）；也可用环境变量 ACODE_TEE 兜底开启，不必改配置。
tee: false

# MCP server 接入（可选，全部注释即不启用）：声明后 ACode 启动自动连接并注册其工具，
# 工具注册名为「server名_工具名」（如 my_server_list_issues）。请写在外部配置
# ~/.acode/config.yaml（全局）或 .acode/config.yaml（项目级），本文件不绑定外部 server。
#
# 命令启动型（stdio 子进程）：
# mcp_servers:
#   my_server:
#     type: stdio
#     command: npx
#     args: [-y, "@modelcontextprotocol/server-everything"]
#     # env: { KEY: value }                # 可选：显式环境变量（其余本机变量一律不传）
#     # timeout: 60                        # 可选：握手/工具调用超时秒数，默认 60
#     # permission: exec                   # 可选：read/write/exec，默认 exec（调用前确认、plan 模式不可见）
#     # enabled: true                      # 可选：开关，默认开
#
# URL 型（Streamable HTTP 远程 server）：
#   remote_server:
#     type: http
#     url: https://example.com/mcp
#     # headers: { Authorization: "Bearer xxx" }   # 可选：静态请求头透传
#     # timeout: 60                        # 可选：超时秒数，默认 60
#     # permission: read                   # 可选：声明 read 则该 server 工具在 /plan 模式可见
#     # enabled: true                      # 可选：开关，默认开

